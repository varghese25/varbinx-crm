<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Varbinx One - Login</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
        }

        .login-container {
            width: 380px;
            padding: 40px;

            background: white;

            border-radius: 12px;

            box-shadow: 0 10px 30px rgba(0,0,0,0.12);
        }

        .logo {
            text-align: center;
        }

        .logo h1 {
            margin-bottom: 5px;
        }

        .tagline {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            margin-top: 15px;

            font-weight: bold;
        }

        input {
            width: 100%;

            padding: 12px;

            border: 1px solid #ccc;
            border-radius: 6px;

            font-size: 15px;
        }

        button {
            width: 100%;

            margin-top: 25px;

            padding: 12px;

            border: none;
            border-radius: 6px;

            background: #222;
            color: white;

            font-size: 16px;

            cursor: pointer;
        }

        button:hover {
            background: #444;
        }

    </style>

</head>


<body>

    <div class="login-container">

        <div class="logo">
            <h1>Varbinx One</h1>

            <div class="tagline">
                One Platform. Any Domain.
            </div>
        </div>


        <form>

            <label for="username">
                Username
            </label>

            <input
                type="text"
                id="username"
                name="username"
                placeholder="Enter username"
                required
            >


            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter password"
                required
            >


            <button type="submit">
                Login
            </button>

        </form>

    </div>

</body>

</html>
